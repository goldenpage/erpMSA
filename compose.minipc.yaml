# 미니PC 배포용 override. compose.yaml의 서비스·포트·볼륨은 그대로 두고
# 외부(LAN)에서 접속할 포트만 모든 인터페이스로 연다.
#
#   docker compose -f compose.yaml -f compose.minipc.yaml up -d --build --wait
#
# `!override`는 기존 127.0.0.1 바인딩을 대체한다(병합 시 같은 포트 충돌 방지).
# Docker Compose v2.24 이상이 필요하다.
# MariaDB·Redis·Kafka·Eureka·각 업무 서비스·Prometheus·Pushgateway는 127.0.0.1에 남긴다.
services:
  gateway-server:
    ports: !override
      - "7070:7070"

  # Grafana를 LAN에서 볼 때만 주석을 해제한다.
  # grafana:
  #   ports: !override
  #     - "3000:3000"
