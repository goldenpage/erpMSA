plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.oopsw'
version = '0.0.1-SNAPSHOT'
description = 'eurekaServer'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.2")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    description = 'Runs isolated unit tests (JUnit tag: unit).'
    useJUnitPlatform { includeTags 'unit' }
    failOnNoDiscoveredTests = false
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('unitTest') {
    group = 'verification'
    description = 'Alias for test: unit tests only, with JaCoCo report.'
    dependsOn tasks.named('test')
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs Spring context, HTTP and Testcontainers tests (tag: integration).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    failOnNoDiscoveredTests = false
    shouldRunAfter tasks.named('test')
    jacoco { enabled = false }
}

jacoco { toolVersion = '0.8.16' }

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') { dependsOn tasks.named('integrationTest') }
