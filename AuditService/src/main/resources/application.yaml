spring:
  application:
    name: AuditService

  datasource:
    url: "${AUDIT_DB_URL:jdbc:mariadb://localhost:3306/auditdb}"
    driver-class-name: org.mariadb.jdbc.Driver
    username: "${AUDIT_DB_USERNAME:account}"
    password: "${AUDIT_DB_PASSWORD:${DB_PASSWORD}}"
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: "${JPA_DDL_AUTO:validate}"
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}"
    consumer:
      group-id: "${KAFKA_AUDIT_GROUP_ID:audit-service-v1}"
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka}"

server:
  port: "${AUDIT_SERVER_PORT:7072}"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  kafka:
    topics:
      account-lifecycle: "${KAFKA_ACCOUNT_LIFECYCLE_TOPIC:account.lifecycle.v1}"
      account-lifecycle-dlt: "${KAFKA_ACCOUNT_LIFECYCLE_DLT_TOPIC:account.lifecycle.v1.DLT}"
