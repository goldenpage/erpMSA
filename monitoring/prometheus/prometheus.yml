global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - eureka-server:8761

  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - account-service:7071

  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - audit-service:7072

  - job_name: item-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - item-service:7073

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - inventory-service:7074

  - job_name: gateway-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway-server:7070
