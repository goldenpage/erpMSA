spring:
  application:
    name: AccountService

  datasource:
    url: "${DB_URL:jdbc:mariadb://localhost:3306/account_service}"
    driver-class-name: org.mariadb.jdbc.Driver
    username: "${DB_USERNAME:account}"
    password: "${DB_PASSWORD}"
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: "${JPA_DDL_AUTO:validate}"
    show-sql: "${JPA_SHOW_SQL:false}"
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:3308}"
      database: "${REDIS_DATABASE:0}"
      username: "${REDIS_USERNAME:}"
      password: "${REDIS_PASSWORD:}"
      connect-timeout: 2s
      timeout: 2s

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka}"

user:
  message: "${ACCOUNT_USER_MESSAGE:AccountService Message}"

server:
  port: "${ACCOUNT_SERVER_PORT:7071}"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  auth:
    issuer: "${JWT_ISSUER:kosta-erp-account}"
    audience: "${JWT_AUDIENCE:kosta-erp-api}"
    secret-base64: "${JWT_SECRET_BASE64}"
    access-ttl: "${JWT_ACCESS_TTL:15m}"
    refresh-ttl: "${JWT_REFRESH_TTL:14d}"
    secure-cookie: "${COOKIE_SECURE:true}"
