spring:
  application:
    name: AccountService

  task:
    scheduling:
      pool:
        # The publisher may wait on Kafka; metrics must still sample backlog.
        size: 2

  datasource:
    url: "${DB_URL:jdbc:mariadb://localhost:3306/account_service}"
    driver-class-name: org.mariadb.jdbc.Driver
    username: "${DB_USERNAME:account}"
    password: "${DB_PASSWORD}"
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: "${JPA_DDL_AUTO:validate}"
    open-in-view: false
    show-sql: "${JPA_SHOW_SQL:false}"
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: "${FLYWAY_BASELINE_ON_MIGRATE:false}"
    baseline-version: 1

  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}"
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:3308}"
      database: "${REDIS_DATABASE:0}"
      username: "${REDIS_USERNAME:}"
      password: "${REDIS_PASSWORD:}"
      connect-timeout: 2s
      timeout: 2s

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka}"

user:
  message: "${ACCOUNT_USER_MESSAGE:AccountService Message}"

server:
  port: "${ACCOUNT_SERVER_PORT:7071}"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  kafka:
    topics:
      account-lifecycle: "${KAFKA_ACCOUNT_LIFECYCLE_TOPIC:account.lifecycle.v1}"
    outbox:
      publish-delay: "${OUTBOX_PUBLISH_DELAY:1s}"
      retry-delay: "${OUTBOX_RETRY_DELAY:5s}"

  auth:
    issuer: "${JWT_ISSUER:kosta-erp-account}"
    audience: "${JWT_AUDIENCE:kosta-erp-api}"
    signing-key-id: "${JWT_SIGNING_KEY_ID:local-k1}"
    private-key-path: "${JWT_PRIVATE_KEY_PATH:../secrets/jwt/private/local-k1.pem}"
    public-key-directory: "${JWT_PUBLIC_KEY_DIRECTORY:../secrets/jwt/public}"
    access-ttl: "${JWT_ACCESS_TTL:15m}"
    refresh-ttl: "${JWT_REFRESH_TTL:14d}"
    secure-cookie: "${COOKIE_SECURE:true}"
