# Disposable lab. Always use performance/lab.py; never point this at application data.
x-java-lab: &java-lab
  JAVA_TOOL_OPTIONS: >-
    -XX:MaxRAMPercentage=65 -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/tmp -XX:NativeMemoryTracking=summary
    -Xlog:gc*:stdout:time,level,tags

services:
  mariadb:
    ports: !reset []
    volumes: !reset []
    tmpfs: [/var/lib/mysql]
    mem_limit: 1536m
    cpus: 2
  redis:
    ports: !reset []
    volumes: !reset []
    tmpfs: [/data]
    # Account A7(Refresh 키 누적)에서 메모리 한계 동작을 관찰하려면 값을 명시해 기록한다.
    mem_limit: ${LAB_REDIS_MEMORY:-1g}
  kafka:
    ports: !reset []
    volumes: !reset []
    tmpfs: [/tmp/kraft-combined-logs]
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    mem_limit: 1024m
  eureka-server:
    image: erpmsa-sprint4/eureka-server:lab
    ports: !reset []
    environment: *java-lab
    mem_limit: 384m
  account-service:
    image: erpmsa-sprint4/account-service:lab
    ports: !reset []
    environment:
      <<: *java-lab
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: ${LAB_ACCOUNT_DB_POOL_SIZE:-10}
    mem_limit: ${LAB_ACCOUNT_MEMORY:-512m}
    # BCrypt는 CPU에 비례하므로 Account 실험은 CPU 제한을 명시해 기록한다.
    cpus: ${LAB_ACCOUNT_CPUS:-2}
  foodmaterials-service:
    image: erpmsa-sprint4/foodmaterials-service:lab
    ports: !reset []
    environment: *java-lab
    mem_limit: 512m
    cpus: 1

  gateway-server:
    image: erpmsa-sprint4/gateway-server:lab
    # 원격 부하 발생기는 사설망 주소만 지정한다(LAB_GATEWAY_BIND). 공인 인터페이스에 노출하지 않는다.
    ports: !override ["${LAB_GATEWAY_BIND:-127.0.0.1}:17070:7070"]
    environment: *java-lab
    # 2026-11-04 Account 부하 중 512m에서 메모리 한계 종료가 반복됐다(docs/account-load-results.md). 대조 실험용으로 조절한다.
    mem_limit: ${LAB_GATEWAY_MEMORY:-512m}
    cpus: 1
  prometheus:
    image: erpmsa-sprint4/prometheus:lab
    command: !override
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}"
      # k6 --prometheus-rw 출력 수신용. 실험 구성에만 켠다.
      - "--web.enable-remote-write-receiver"
    ports: !override ["127.0.0.1:19090:9090"]
  grafana:
    image: erpmsa-sprint4/grafana:lab
    ports: !override ["127.0.0.1:13000:3000"]

  k6:
    image: grafana/k6:1.7.1
    profiles: [load]
    user: "0:0"
    volumes:
      - ./performance:/work
    working_dir: /work
    mem_limit: ${LAB_K6_MEMORY:-512m}
    cpus: ${LAB_K6_CPUS:-1}

  menus-service:
    image: erpmsa-sprint4/menus-service:lab
    ports: !reset []
    environment: *java-lab
    mem_limit: 512m
    cpus: 1

  notices-service:
    image: erpmsa-sprint4/notices-service:lab
    ports: !reset []
    environment: *java-lab
    mem_limit: 256m
    cpus: 1

  bills-service:
    image: erpmsa-sprint4/bills-service:lab
    ports: !reset []
    environment: *java-lab
    mem_limit: 256m
    cpus: 1

  purchase-service:
    image: erpmsa-sprint4/purchase-service:lab
    ports: !reset []
    environment: *java-lab
    mem_limit: 256m
    cpus: 1

  disposals-service:
    image: erpmsa-sprint4/disposals-service:lab
    ports: !reset []
    environment: *java-lab
    mem_limit: 512m
    cpus: 1


# Base Compose uses explicit global volume names. Override even currently unused
# volumes so `down -v` can never select the application's persistent volumes.
volumes:
  mariadb-data:
    name: erpmsa-sprint4-lab-mariadb-data
  redis-data:
    name: erpmsa-sprint4-lab-redis-data
  kafka-data:
    name: erpmsa-sprint4-lab-kafka-data
  prometheus-data:
    name: erpmsa-sprint4-lab-prometheus-data
  grafana-data:
    name: erpmsa-sprint4-lab-grafana-data
