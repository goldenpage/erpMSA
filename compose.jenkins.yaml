name: erpmsa-jenkins

services:
  jenkins:
    build:
      context: ./jenkins
    image: erpmsa/jenkins:lts-jdk21
    container_name: erpmsa-jenkins
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    group_add:
      - "${JENKINS_DOCKER_GID:-0}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins-home:
    name: erpmsa-jenkins-home
