services:
  mariadb:
    restart: "no"
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /var/lib/mysql

  redis:
    restart: "no"
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /data

  kafka:
    restart: "no"
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /tmp/kraft-combined-logs

  eureka-server:
    image: "${CI_PROJECT_NAME:-erpmsa-ci}/eureka-server:${BUILD_NUMBER:-local}"
    restart: "no"
    ports: !reset []

  account-service:
    volumes: !override
      - ci-jwt-public:/run/jwt-public:ro
      - ci-jwt-private:/run/jwt-private:ro
    secrets: !reset []
    environment:
      JWT_PRIVATE_KEY_PATH: /run/jwt-private/${JWT_SIGNING_KEY_ID:-local-k1}.pem
    image: "${CI_PROJECT_NAME:-erpmsa-ci}/account-service:${BUILD_NUMBER:-local}"
    restart: "no"
    ports: !reset []

  foodmaterials-service:
    volumes: !override
      - ci-jwt-public:/run/jwt-public:ro
    image: "${CI_PROJECT_NAME:-erpmsa-ci}/foodmaterials-service:${BUILD_NUMBER:-local}"
    restart: "no"
    ports: !reset []

  gateway-server:
    volumes: !override
      - ci-jwt-public:/run/jwt-public:ro
    image: "${CI_PROJECT_NAME:-erpmsa-ci}/gateway-server:${BUILD_NUMBER:-local}"
    restart: "no"
    ports: !reset []

  prometheus:
    image: "${CI_PROJECT_NAME:-erpmsa-ci}/prometheus:${BUILD_NUMBER:-local}"
    restart: "no"
    ports: !reset []

  grafana:
    image: "${CI_PROJECT_NAME:-erpmsa-ci}/grafana:${BUILD_NUMBER:-local}"
    restart: "no"
    ports: !reset []

  menus-service:
    volumes: !override
      - ci-jwt-public:/run/jwt-public:ro
    image: "${CI_PROJECT_NAME:-erpmsa-ci}/menus-service:${BUILD_NUMBER:-local}"
    restart: "no"
    ports: !reset []

  notices-service:
    volumes: !override
      - ci-jwt-public:/run/jwt-public:ro
    image: "${CI_PROJECT_NAME:-erpmsa-ci}/notices-service:${BUILD_NUMBER:-local}"
    restart: "no"
    ports: !reset []

  bills-service:
    volumes: !override
      - ci-jwt-public:/run/jwt-public:ro
    image: "${CI_PROJECT_NAME:-erpmsa-ci}/bills-service:${BUILD_NUMBER:-local}"
    restart: "no"
    ports: !reset []

  purchase-service:
    volumes: !override
      - ci-jwt-public:/run/jwt-public:ro
    image: "${CI_PROJECT_NAME:-erpmsa-ci}/purchase-service:${BUILD_NUMBER:-local}"
    restart: "no"
    ports: !reset []

  disposals-service:
    volumes: !override
      - ci-jwt-public:/run/jwt-public:ro
    image: "${CI_PROJECT_NAME:-erpmsa-ci}/disposals-service:${BUILD_NUMBER:-local}"
    restart: "no"
    ports: !reset []


volumes:
  ci-jwt-public:
    name: "${CI_PROJECT_NAME:-erpmsa-ci}-jwt-public"
  ci-jwt-private:
    name: "${CI_PROJECT_NAME:-erpmsa-ci}-jwt-private"
  mariadb-data:
    name: "${CI_PROJECT_NAME:-erpmsa-ci}-mariadb-data"

  redis-data:
    name: "${CI_PROJECT_NAME:-erpmsa-ci}-redis-data"

  kafka-data:
    name: "${CI_PROJECT_NAME:-erpmsa-ci}-kafka-data"

  prometheus-data:
    name: "${CI_PROJECT_NAME:-erpmsa-ci}-prometheus-data"

  grafana-data:
    name: "${CI_PROJECT_NAME:-erpmsa-ci}-grafana-data"

secrets: !reset {}
