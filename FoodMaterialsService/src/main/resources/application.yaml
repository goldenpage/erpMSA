spring:
  application:
    name: FoodMaterialsService
  threads:
    virtual:
      enabled: true
  datasource:
    url: "${FOOD_MATERIAL_DB_URL:jdbc:mariadb://localhost:3306/itemdb}"
    username: "${FOOD_MATERIAL_DB_USERNAME:account}"
    password: "${FOOD_MATERIAL_DB_PASSWORD:${DB_PASSWORD:}}"
  jpa:
    hibernate:
      ddl-auto: "${JPA_DDL_AUTO:validate}"
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: "${FOOD_MATERIAL_FLYWAY_BASELINE_ON_MIGRATE:false}"

server:
  port: "${FOOD_MATERIAL_SERVER_PORT:7073}"

eureka:
  instance:
    instance-id: "${spring.application.name}:${spring.application.instance_id:${random.value}}"
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka}"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  inventory:
    datasource:
      url: "${FOOD_MATERIAL_INVENTORY_DB_URL:jdbc:mariadb://localhost:3306/inventorydb}"
      username: "${FOOD_MATERIAL_INVENTORY_DB_USERNAME:${FOOD_MATERIAL_DB_USERNAME:account}}"
      password: "${FOOD_MATERIAL_INVENTORY_DB_PASSWORD:${FOOD_MATERIAL_DB_PASSWORD:${DB_PASSWORD:}}}"
      hikari:
        pool-name: FoodMaterialsInventoryPool
        maximum-pool-size: ${FOOD_MATERIAL_INVENTORY_DB_POOL_SIZE:10}
    flyway:
      baseline-on-migrate: "${FOOD_MATERIAL_INVENTORY_FLYWAY_BASELINE_ON_MIGRATE:false}"
  auth:
    issuer: "${JWT_ISSUER:kosta-erp-account}"
    audience: "${JWT_AUDIENCE:kosta-erp-api}"
    public-key-directory: "${JWT_PUBLIC_KEY_DIRECTORY:../secrets/jwt/public}"
