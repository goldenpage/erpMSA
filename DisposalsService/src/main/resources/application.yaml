spring:
  application:
    name: DisposalsService
  datasource:
    url: "${DISPOSALS_DB_URL:jdbc:mariadb://localhost:3306/disposalsdb}"
    username: "${DISPOSALS_DB_USERNAME:account}"
    password: "${DISPOSALS_DB_PASSWORD:${DB_PASSWORD:}}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
  cloud:
    loadbalancer:
      cache:
        # FoodMaterials 호출용 로드밸런서 인스턴스 목록 캐시(기본 35초). FoodMaterials가 재배포로 DOWN을 알리면
        # drain(15s) 안에 목록에서 빠져야 한다. Gateway와 같은 5초.
        ttl: "${DISPOSALS_LB_CACHE_TTL:5s}"
server:
  port: "${DISPOSALS_SERVER_PORT:7077}"
eureka:
  instance:
    instance-id: "${spring.application.name}:${spring.application.instance_id:${random.value}}"
  client:
    register-with-eureka: true
    fetch-registry: true
    # FoodMaterials 재배포 반영 속도: 레지스트리를 5초마다 받는다(기본 30초). 이 주기 + 로드밸런서 캐시가
    # FoodMaterials drain 시간보다 짧아야 종료 중인 인스턴스로 재고 차감을 보내지 않는다.
    registry-fetch-interval-seconds: "${DISPOSALS_REGISTRY_FETCH_SECONDS:5}"
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true
app:
  shutdown:
    # 종료 시 Eureka에 DOWN을 알리고 이 시간 동안 요청을 계속 받는다(shared/service-foundation DiscoveryDrainLifecycle).
    # 호출하는 쪽(Gateway, Disposals→FoodMaterials)의 레지스트리 갱신(5s) + 로드밸런서 캐시(5s)보다 길어야 한다. 0이면 끈다.
    discovery-drain: "${SHUTDOWN_DISCOVERY_DRAIN:15s}"
  inventory:
    base-url: "${FOOD_MATERIAL_SERVICE_BASE_URL:http://FOODMATERIALSSERVICE}"
    discovery-enabled: "${FOOD_MATERIAL_DISCOVERY_ENABLED:true}"
  service:
    base-path: /disposals
  auth:
    issuer: "${JWT_ISSUER:kosta-erp-account}"
    audience: "${JWT_AUDIENCE:kosta-erp-api}"
    public-key-directory: "${JWT_PUBLIC_KEY_DIRECTORY:../secrets/jwt/public}"
