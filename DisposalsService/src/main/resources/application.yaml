spring:
  application:
    name: DisposalsService
  datasource:
    url: "${DISPOSALS_DB_URL:jdbc:mariadb://localhost:3306/disposalsdb}"
    username: "${DISPOSALS_DB_USERNAME:account}"
    password: "${DISPOSALS_DB_PASSWORD:${DB_PASSWORD:}}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
server:
  port: "${DISPOSALS_SERVER_PORT:7077}"
eureka:
  instance:
    instance-id: "${spring.application.name}:${spring.application.instance_id:${random.value}}"
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true
app:
  inventory:
    base-url: "${FOOD_MATERIAL_SERVICE_BASE_URL:http://FOODMATERIALSSERVICE}"
    discovery-enabled: "${FOOD_MATERIAL_DISCOVERY_ENABLED:true}"
  service:
    base-path: /disposals
  auth:
    issuer: "${JWT_ISSUER:kosta-erp-account}"
    audience: "${JWT_AUDIENCE:kosta-erp-api}"
    public-key-directory: "${JWT_PUBLIC_KEY_DIRECTORY:../secrets/jwt/public}"
