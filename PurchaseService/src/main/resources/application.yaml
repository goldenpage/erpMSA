spring:
  application:
    name: PurchaseService
server:
  port: "${PURCHASE_SERVER_PORT:7076}"
eureka:
  instance:
    instance-id: "${spring.application.name}:${spring.application.instance_id:${random.value}}"
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true
app:
  service:
    base-path: /purchase
  auth:
    issuer: "${JWT_ISSUER:kosta-erp-account}"
    audience: "${JWT_AUDIENCE:kosta-erp-api}"
    public-key-directory: "${JWT_PUBLIC_KEY_DIRECTORY:../secrets/jwt/public}"
