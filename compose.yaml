name: erpmsa

services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: mydb
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      MARIADB_USER: account
      MARIADB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  database-init:
    image: mariadb:10.11
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
    depends_on:
      mariadb:
        condition: service_healthy
    command:
      - sh
      - -ec
      - >-
        MYSQL_PWD="$$MARIADB_ROOT_PASSWORD" mariadb
        --host=mariadb --user=root
        --execute="CREATE DATABASE IF NOT EXISTS itemdb
        CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
        CREATE DATABASE IF NOT EXISTS inventorydb
        CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
        GRANT ALL PRIVILEGES ON inventorydb.* TO 'account'@'%';
        GRANT ALL PRIVILEGES ON itemdb.* TO 'account'@'%';
        FLUSH PRIVILEGES;"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:3308:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: >-
        INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server 127.0.0.1:9092 --list
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  eureka-server:
    build:
      context: ./eurekaServer
    image: erpmsa/eureka-server:local
    restart: unless-stopped
    environment:
      EUREKA_SERVER_PORT: "8761"
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8761"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  account-service:
    build:
      context: .
      dockerfile: AccountService/Dockerfile
    image: erpmsa/account-service:local
    restart: unless-stopped
    environment:
      ACCOUNT_SERVER_PORT: "7071"
      DB_URL: jdbc:mariadb://mariadb:3306/mydb
      DB_USERNAME: account
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: "false"
      FLYWAY_BASELINE_ON_MIGRATE: "${FLYWAY_BASELINE_ON_MIGRATE:-true}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ACCOUNT_LIFECYCLE_TOPIC: "${KAFKA_ACCOUNT_LIFECYCLE_TOPIC:-account.lifecycle.v1}"
      OUTBOX_PUBLISH_DELAY: "${OUTBOX_PUBLISH_DELAY:-1s}"
      OUTBOX_RETRY_DELAY: "${OUTBOX_RETRY_DELAY:-5s}"
      JWT_ISSUER: "${JWT_ISSUER:-kosta-erp-account}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-kosta-erp-api}"
      JWT_PUBLIC_KEY_DIRECTORY: /run/jwt-public
      JWT_SIGNING_KEY_ID: "${JWT_SIGNING_KEY_ID:-local-k1}"
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-15m}"
      JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-14d}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      ACCOUNT_USER_MESSAGE: "${ACCOUNT_USER_MESSAGE:-AccountService Message}"
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEYS_HOST_DIR:-./secrets/jwt/public}
        target: /run/jwt-public
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - jwt_private_key
    ports:
      - "127.0.0.1:7071:7071"
    depends_on:
      mariadb:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7071"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  foodmaterials-service:
    build:
      context: .
      dockerfile: FoodMaterialsService/Dockerfile
    image: erpmsa/foodmaterials-service:local
    restart: unless-stopped
    environment:
      FOOD_MATERIAL_SERVER_PORT: "7073"
      FOOD_MATERIAL_DB_URL: jdbc:mariadb://mariadb:3306/itemdb
      FOOD_MATERIAL_DB_USERNAME: account
      FOOD_MATERIAL_DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      JPA_DDL_AUTO: validate
      FOOD_MATERIAL_FLYWAY_BASELINE_ON_MIGRATE: "false"
      FOOD_MATERIAL_INVENTORY_DB_URL: jdbc:mariadb://mariadb:3306/inventorydb
      FOOD_MATERIAL_INVENTORY_DB_USERNAME: account
      FOOD_MATERIAL_INVENTORY_DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      FOOD_MATERIAL_INVENTORY_FLYWAY_BASELINE_ON_MIGRATE: "false"
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      JWT_ISSUER: "${JWT_ISSUER:-kosta-erp-account}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-kosta-erp-api}"
      JWT_PUBLIC_KEY_DIRECTORY: /run/jwt-public
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEYS_HOST_DIR:-./secrets/jwt/public}
        target: /run/jwt-public
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:7073:7073"
    depends_on:
      database-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7073"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  menus-service:
    build:
      context: .
      dockerfile: MenusService/Dockerfile
    image: erpmsa/menus-service:local
    restart: unless-stopped
    environment:
      MENUS_SERVER_PORT: "7072"
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      JWT_ISSUER: "${JWT_ISSUER:-kosta-erp-account}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-kosta-erp-api}"
      JWT_PUBLIC_KEY_DIRECTORY: /run/jwt-public
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEYS_HOST_DIR:-./secrets/jwt/public}
        target: /run/jwt-public
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:7072:7072"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7072"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  notices-service:
    build:
      context: .
      dockerfile: NoticesService/Dockerfile
    image: erpmsa/notices-service:local
    restart: unless-stopped
    environment:
      NOTICES_SERVER_PORT: "7074"
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      JWT_ISSUER: "${JWT_ISSUER:-kosta-erp-account}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-kosta-erp-api}"
      JWT_PUBLIC_KEY_DIRECTORY: /run/jwt-public
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEYS_HOST_DIR:-./secrets/jwt/public}
        target: /run/jwt-public
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:7074:7074"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7074"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  bills-service:
    build:
      context: .
      dockerfile: BillsService/Dockerfile
    image: erpmsa/bills-service:local
    restart: unless-stopped
    environment:
      BILLS_SERVER_PORT: "7075"
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      JWT_ISSUER: "${JWT_ISSUER:-kosta-erp-account}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-kosta-erp-api}"
      JWT_PUBLIC_KEY_DIRECTORY: /run/jwt-public
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEYS_HOST_DIR:-./secrets/jwt/public}
        target: /run/jwt-public
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:7075:7075"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7075"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  purchase-service:
    build:
      context: .
      dockerfile: PurchaseService/Dockerfile
    image: erpmsa/purchase-service:local
    restart: unless-stopped
    environment:
      PURCHASE_SERVER_PORT: "7076"
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      JWT_ISSUER: "${JWT_ISSUER:-kosta-erp-account}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-kosta-erp-api}"
      JWT_PUBLIC_KEY_DIRECTORY: /run/jwt-public
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEYS_HOST_DIR:-./secrets/jwt/public}
        target: /run/jwt-public
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:7076:7076"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7076"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  disposals-service:
    build:
      context: .
      dockerfile: DisposalsService/Dockerfile
    image: erpmsa/disposals-service:local
    restart: unless-stopped
    environment:
      DISPOSALS_SERVER_PORT: "7077"
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      JWT_ISSUER: "${JWT_ISSUER:-kosta-erp-account}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-kosta-erp-api}"
      JWT_PUBLIC_KEY_DIRECTORY: /run/jwt-public
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEYS_HOST_DIR:-./secrets/jwt/public}
        target: /run/jwt-public
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:7077:7077"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7077"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  gateway-server:
    build:
      context: .
      dockerfile: gatewayServer/Dockerfile
    image: erpmsa/gateway-server:local
    restart: unless-stopped
    environment:
      GATEWAY_SERVER_PORT: "7070"
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      JWT_ISSUER: "${JWT_ISSUER:-kosta-erp-account}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-kosta-erp-api}"
      JWT_PUBLIC_KEY_DIRECTORY: /run/jwt-public
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEYS_HOST_DIR:-./secrets/jwt/public}
        target: /run/jwt-public
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:7070:7070"
    depends_on:
      eureka-server:
        condition: service_healthy
      account-service:
        condition: service_healthy
      foodmaterials-service:
        condition: service_healthy
      menus-service:
        condition: service_healthy
      notices-service:
        condition: service_healthy
      bills-service:
        condition: service_healthy
      purchase-service:
        condition: service_healthy
      disposals-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7070"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  prometheus:
    build:
      context: ./monitoring/prometheus
    image: erpmsa/prometheus:local
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
    depends_on:
      eureka-server:
        condition: service_healthy
      account-service:
        condition: service_healthy
      foodmaterials-service:
        condition: service_healthy
      gateway-server:
        condition: service_healthy
      menus-service:
        condition: service_healthy
      notices-service:
        condition: service_healthy
      bills-service:
        condition: service_healthy
      purchase-service:
        condition: service_healthy
      disposals-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  grafana:
    build:
      context: ./monitoring/grafana
    image: erpmsa/grafana:local
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}"
      GF_SECURITY_SECRET_KEY: "${GRAFANA_SECRET_KEY:?GRAFANA_SECRET_KEY must be set in .env}"
      GF_SECURITY_COOKIE_SECURE: "${GRAFANA_COOKIE_SECURE:-false}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  mariadb-data:
    name: erpmsa-mariadb-data
  redis-data:
    name: erpmsa-redis-data
  kafka-data:
    name: erpmsa-kafka-data
  prometheus-data:
    name: erpmsa-prometheus-data
  grafana-data:
    name: erpmsa-grafana-data

secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_HOST_FILE:-./secrets/jwt/private/local-k1.pem}
