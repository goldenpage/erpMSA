spring:
  application:
    name: ItemService
  threads:
    virtual:
      enabled: true
  datasource:
    url: "${ITEM_DB_URL:jdbc:mariadb://localhost:3306/itemdb}"
    username: "${ITEM_DB_USERNAME:account}"
    password: "${ITEM_DB_PASSWORD:${DB_PASSWORD:}}"
  jpa:
    hibernate:
      ddl-auto: "${JPA_DDL_AUTO:validate}"
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: "${ITEM_FLYWAY_BASELINE_ON_MIGRATE:false}"

server:
  port: "${ITEM_SERVER_PORT:7073}"

eureka:
  instance:
    instance-id: "${spring.application.name}:${spring.application.instance_id:${random.value}}"
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka}"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  auth:
    issuer: "${JWT_ISSUER:kosta-erp-account}"
    audience: "${JWT_AUDIENCE:kosta-erp-api}"
    secret-base64: "${JWT_SECRET_BASE64}"
