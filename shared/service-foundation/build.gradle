plugins { id 'java-library' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    api platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.2')
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation project(':jwt-security')
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// 이 모듈을 포함한 각 서비스의 `gradlew test`가 공통 drain 단위 테스트도 함께 실행한다.
tasks.named('test') { useJUnitPlatform() }
layout.buildDirectory = rootProject.layout.buildDirectory.dir('service-foundation')
