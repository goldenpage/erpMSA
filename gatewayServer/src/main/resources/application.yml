spring:
  application:
    name: gatewayServer
  threads:
    virtual:
      enabled: true # Tomcat 기반의 동기 처리를 극대화하는 가상 스레드 활성화
  # 하류 서비스 호출 클라이언트.
  # Eureka 클라이언트가 Apache HttpClient 5를 함께 가져오면 Gateway가 그것을 자동 선택하고, 기본 연결 풀
  # (호스트당 5개, 전체 25개)이 숨은 동시 처리 상한이 된다(docs/account-load-results.md 개선 후 측정).
  # JDK 클라이언트를 명시하고 동시 처리 상한은 RouteInFlightLimitFilter 한 곳에서 관리한다.
  # 제한 시간은 응답 없는 하류에 Gateway 요청이 무한정 묶이지 않게 한다.
  http:
    clients:
      imperative:
        factory: jdk
      connect-timeout: "${GATEWAY_DOWNSTREAM_CONNECT_TIMEOUT:2s}"
      read-timeout: "${GATEWAY_DOWNSTREAM_READ_TIMEOUT:10s}"
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: account-service
            uri: lb://ACCOUNTSERVICE
            predicates:
              - Path=/account/**
            filters:
              - AddRequestHeader=X-Gateway-Request, true
              - AddResponseHeader=X-Gateway-Response, true
          - id: menus-service
            uri: lb://MENUSSERVICE
            predicates:
              - Path=/menus/**
          - id: foodmaterials-service
            uri: lb://FOODMATERIALSSERVICE
            predicates:
              - Path=/foodmaterials/**
          - id: notices-service
            uri: lb://NOTICESSERVICE
            predicates:
              - Path=/notices/**
          - id: bills-service
            uri: lb://BILLSSERVICE
            predicates:
              - Path=/bills/**
          - id: purchase-service
            uri: lb://PURCHASESERVICE
            predicates:
              - Path=/purchase/**
          - id: disposals-service
            uri: lb://DISPOSALSSERVICE
            predicates:
              - Path=/disposals/**


eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka}"

server:
  port: "${GATEWAY_SERVER_PORT:7070}"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  gateway:
    # 경로별 동시 처리 상한(RouteInFlightLimitFilter). 넘는 요청은 기다리지 않고 503 ROUTE_BUSY.
    in-flight:
      max-per-route: "${GATEWAY_MAX_IN_FLIGHT_PER_ROUTE:50}"
    # 하류로 보내는 X-Client-Address(ClientAddressFilter). 비어 있으면 Gateway에 직접 연결한 주소를 쓴다.
    # 앞단 로드밸런서 등 믿을 수 있는 프록시 대역(CIDR, 쉼표 구분)을 지정하면 그 프록시가 붙인 X-Forwarded-For를 따른다.
    client-address:
      trusted-upstreams: "${GATEWAY_TRUSTED_UPSTREAMS:}"
  auth:
    issuer: "${JWT_ISSUER:kosta-erp-account}"
    audience: "${JWT_AUDIENCE:kosta-erp-api}"
    public-key-directory: "${JWT_PUBLIC_KEY_DIRECTORY:../secrets/jwt/public}"
