spring:
  application:
    name: gatewayServer
  threads:
    virtual:
      enabled: true # Tomcat 기반의 동기 처리를 극대화하는 가상 스레드 활성화
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: account-service
            uri: lb://ACCOUNTSERVICE
            predicates:
              - Path=/account/**
            filters:
              - AddRequestHeader=X-Gateway-Request, true
              - AddResponseHeader=X-Gateway-Response, true
          - id: menus-service
            uri: lb://MENUSSERVICE
            predicates:
              - Path=/menus/**
          - id: foodmaterials-service
            uri: lb://FOODMATERIALSSERVICE
            predicates:
              - Path=/foodmaterials/**
          - id: notices-service
            uri: lb://NOTICESSERVICE
            predicates:
              - Path=/notices/**
          - id: bills-service
            uri: lb://BILLSSERVICE
            predicates:
              - Path=/bills/**
          - id: purchase-service
            uri: lb://PURCHASESERVICE
            predicates:
              - Path=/purchase/**
          - id: disposals-service
            uri: lb://DISPOSALSSERVICE
            predicates:
              - Path=/disposals/**


eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka}"

server:
  port: "${GATEWAY_SERVER_PORT:7070}"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  auth:
    issuer: "${JWT_ISSUER:kosta-erp-account}"
    audience: "${JWT_AUDIENCE:kosta-erp-api}"
    public-key-directory: "${JWT_PUBLIC_KEY_DIRECTORY:../secrets/jwt/public}"
