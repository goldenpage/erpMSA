spring:
  application:
    name: MenusService
  datasource:
    url: "${MENUS_DB_URL:jdbc:mariadb://localhost:3306/menusdb}"
    username: "${MENUS_DB_USERNAME:account}"
    password: "${MENUS_DB_PASSWORD:${DB_PASSWORD:}}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
server:
  port: "${MENUS_SERVER_PORT:7072}"
eureka:
  instance:
    instance-id: "${spring.application.name}:${spring.application.instance_id:${random.value}}"
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true
app:
  shutdown:
    # 종료 시 Eureka에 DOWN을 알리고 이 시간 동안 요청을 계속 받는다(shared/service-foundation DiscoveryDrainLifecycle).
    # 호출하는 쪽(Gateway, Disposals→FoodMaterials)의 레지스트리 갱신(5s) + 로드밸런서 캐시(5s)보다 길어야 한다. 0이면 끈다.
    discovery-drain: "${SHUTDOWN_DISCOVERY_DRAIN:15s}"
  service:
    base-path: /menus
  auth:
    issuer: "${JWT_ISSUER:kosta-erp-account}"
    audience: "${JWT_AUDIENCE:kosta-erp-api}"
    public-key-directory: "${JWT_PUBLIC_KEY_DIRECTORY:../secrets/jwt/public}"
